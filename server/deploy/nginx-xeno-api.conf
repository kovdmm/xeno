# /etc/nginx/snippets/xeno-api.conf: included once, inside the 443 server block of xeno.kovalev.app.
location /api/ {
    limit_req zone=xeno_api_read burst=20 nodelay;
    limit_req zone=xeno_api_post burst=3 nodelay;
    limit_req_status 429;

    client_max_body_size 256k;
    client_body_timeout 15s;

    proxy_pass http://127.0.0.1:3002;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # the address the service limits by and hashes: set here, so a client cannot send its own
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    # a replay may take up to 90 s of CPU, but the service answers 202 after 8 s and the page polls; this is the longest nginx waits for one answer
    proxy_read_timeout 30s;
    proxy_buffering off;
}
