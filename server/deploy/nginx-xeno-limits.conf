# /etc/nginx/conf.d/xeno-scores.conf (http level): the rate limits of the highscore API.
# Reads: 60 a minute per address (a table is read when a screen opens). Submissions: 10 a minute per address;
# the service itself allows five an hour. The zones are small (5 MB is about 80 000 addresses).
limit_req_zone $binary_remote_addr zone=xeno_api_read:5m rate=60r/m;

# only POST has a key, the others are not counted here
map $request_method $xeno_api_post_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $xeno_api_post_key zone=xeno_api_post:5m rate=10r/m;
