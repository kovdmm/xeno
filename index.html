<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
      /* the loading screen covers the page until it is built (texts, fonts, layout): no flash of an empty interface.
         It has no words of its own: the language is not known yet. */
      html {
        background: #050605;
      }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 100000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        background: radial-gradient(ellipse at 50% 40%, #16200f 0%, #050605 70%);
        transition:
          opacity 0.3s ease-out,
          visibility 0s linear 0.3s;
      }
      html.ready #boot {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
      }
      #boot b {
        font:
          700 22px/1 "Arial Black",
          Impact,
          sans-serif;
        letter-spacing: 0.18em;
        color: #ece4d0;
        text-transform: uppercase;
      }
      #boot b span {
        color: #8dff3a;
      }
      #boot i {
        display: block;
        width: 140px;
        height: 3px;
        border-radius: 2px;
        background: #1c241a;
        overflow: hidden;
      }
      #boot i::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        background: #8dff3a;
        animation: boot-run 1s ease-in-out infinite;
      }
      @keyframes boot-run {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(350%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot i::after {
          animation: none;
          width: 100%;
          opacity: 0.5;
        }
      }
    </style>
    <script>
      // the browser offers installing once, possibly before the game's scripts have run: keep the offer for them
      window.addEventListener("beforeinstallprompt", function (e) {
        e.preventDefault();
        window.__xtInstall = e;
      });
      // if the game fails to start, show the page anyway rather than a blank screen
      setTimeout(function () {
        document.documentElement.classList.add("ready");
      }, 5000); // after the fonts' own wait in src/main.ts (up to 3 s from the start of the game)
    </script>
    <title>Xeno-Tactics</title>
    <meta name="theme-color" content="#050605" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Xeno" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Russo+One&amp;family=PT+Sans+Narrow:wght@400;700&amp;display=swap"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="boot" aria-hidden="true"><img src="icon.svg" alt="" /><b>Xeno<span>-</span>Tactics</b><i></i></div>
    <!-- Structure: src/game (simulation, no DOM) · src/render (canvas look, layers) · src/audio (sound) · src/i18n (texts) · src/ui (interface and loop) · src/app.ts (services) · src/main.ts (wiring) · style.css (page look) -->

    <div class="app" id="app">
      <div class="dlogo" data-i="brand" aria-hidden="true"></div>
      <header class="hdr" id="hdr">
        <div class="stats">
          <div class="chip c-cred" data-i-label="cCred">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 2l7 5v10l-7 5-7-5V7z" fill="#ffb22e" stroke="#000" stroke-width="1.6" />
              <path d="M12 2v20M5 7l14 10M19 7L5 17" stroke="rgba(0,0,0,.35)" stroke-width="1" /></svg
            ><b id="sCred">0</b>
          </div>
          <div class="chip c-lives" data-i-label="cLives">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 21s-8-5.3-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.7-8 11-8 11z"
                fill="#d81f36"
                stroke="#000"
                stroke-width="1.6"
              /></svg
            ><b id="sLives">0</b>
          </div>
          <div class="chip c-wave" data-i-label="cWave">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 3c-4.4 0-7.5 3-7.5 7.2 0 2.4 1.1 4.1 2.7 5.2v2.4c0 .7.5 1.2 1.1 1.2h7.4c.6 0 1.1-.5 1.1-1.2v-2.4c1.6-1.1 2.7-2.8 2.7-5.2C19.5 6 16.4 3 12 3z"
                fill="#cfc6b4"
                stroke="#000"
                stroke-width="1.6"
              />
              <circle cx="9" cy="10.8" r="2" fill="#000" />
              <circle cx="15" cy="10.8" r="2" fill="#000" /></svg
            ><b id="sWave">0</b>
          </div>
          <div class="chip c-score" data-i-label="cScore">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12 2.5l2.8 6 6.5.7-4.9 4.4 1.4 6.4L12 16.7 6.2 20l1.4-6.4L2.7 9.2l6.5-.7z"
                fill="#8dff3a"
                stroke="#000"
                stroke-width="1.6"
              /></svg
            ><b id="sScore">0</b>
          </div>
        </div>
      </header>

      <div class="stage" id="stage">
        <div class="fieldWrap" id="fw">
          <canvas id="field"></canvas>
          <div class="banner" id="banner"></div>
          <div class="toast" id="toast" style="opacity: 0"></div>
        </div>
      </div>

      <div class="dock" id="dock">
        <div class="wave plate">
          <div class="next" id="next"></div>
          <div class="prog"><i id="progBar" style="width: 0%"></i></div>
        </div>
        <div class="ctrl">
          <button class="go" id="go">Start</button>
          <button class="speed" id="speedBtn" data-i-label="speed">×1</button>
          <button class="speed pausebtn" id="pauseBtn" data-i-label="paused">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6" y="5" width="4" height="14" fill="currentColor" />
              <rect x="14" y="5" width="4" height="14" fill="currentColor" />
            </svg>
          </button>
        </div>
        <div class="pal" id="pal">
          <div class="towers" id="towers"></div>
          <div class="abil" id="abil"></div>
        </div>
        <div class="info plate" id="info" hidden></div>
      </div>
    </div>

    <!-- title screen -->
    <div class="screen menu" id="menu">
      <div class="menuIn">
        <h1 class="logo" data-i="brand">Xeno<span>-</span>Tactics</h1>
        <p class="tagline" data-i="tagline"></p>
        <div class="mbtns">
          <button class="big go" id="mPlay" data-i="play"></button>
          <button class="big" id="mNew" data-i="newGame" hidden></button>
          <button class="big" id="mLevel"></button>
          <button class="big" id="mDiff"></button>
          <button class="big" id="mSettings" data-i="settings"></button>
          <button class="big" id="mRecords" data-i="recordsBtn"></button>
          <button class="big" id="mHelp" data-i="help"></button>
        </div>
        <p class="mbest" id="mBest"></p>
      </div>
    </div>

    <!-- pause -->
    <div class="screen" id="pause" hidden>
      <div class="menuIn">
        <h2 class="scrTitle" data-i="paused"></h2>
        <div class="mbtns">
          <button class="big go" id="pResume" data-i="resume"></button>
          <button class="big" id="pRestart" data-i="restart"></button>
          <button class="big" id="pSettings" data-i="settings"></button>
          <button class="big" id="pHelp" data-i="help"></button>
          <button class="big" id="pMenu" data-i="mainMenu"></button>
        </div>
      </div>
    </div>

    <!-- game over -->
    <div class="screen over" id="over" hidden>
      <div class="menuIn">
        <h2 class="scrTitle" id="overTtl">Base destroyed</h2>
        <div class="overTxt" id="overTxt"></div>
        <!-- the finished game can be entered into the table (only when it started from the server's seed) -->
        <div class="saveBox" id="saveBox" hidden>
          <label class="saveLbl"
            ><span data-i="saveNick"></span
            ><input
              id="saveNick"
              type="text"
              maxlength="16"
              autocomplete="nickname"
              spellcheck="false"
              enterkeyhint="done"
          /></label>
          <button class="big go" id="saveBtn" data-i="saveBtn"></button>
          <p class="note" id="saveMsg" role="status" aria-live="polite"></p>
        </div>
        <div class="mbtns">
          <button class="big go" id="restart" data-i="restart"></button>
          <button class="big" id="overRecords" data-i="recordsBtn"></button>
          <button class="big" id="overDiff" data-i="settings"></button>
          <button class="big" id="overMenu" data-i="mainMenu"></button>
        </div>
      </div>
    </div>

    <div class="modal" id="records" hidden>
      <div class="in plate">
        <div class="mhead">
          <h2 data-i="recordsBtn"></h2>
          <button class="icon x" id="recClose" data-i-label="close">✕</button>
        </div>
        <div class="recPick">
          <select id="recLevel" data-i-label="recMap"></select>
          <select id="recDiff" data-i-label="recDiff"></select>
        </div>
        <p class="note" id="recStatus" role="status" aria-live="polite"></p>
        <table class="recTable">
          <thead>
            <tr>
              <th data-i="recRank"></th>
              <th data-i="recName"></th>
              <th data-i="recWaves"></th>
              <th data-i="recScore"></th>
              <th data-i="recTime"></th>
            </tr>
          </thead>
          <tbody id="recBody"></tbody>
        </table>
        <p class="note" data-i="recNote"></p>
      </div>
    </div>

    <div class="modal" id="help" hidden>
      <div class="in plate">
        <div class="mhead">
          <h2 data-i="help"></h2>
          <button class="icon x" id="helpClose" data-i-label="close">✕</button>
        </div>
        <p id="bestLine"></p>
        <div id="helpText">
          <p data-i="help1"></p>
          <p data-i="help2"></p>
          <p data-i="help3"></p>
          <p data-i="help4"></p>
          <p data-i="help5"></p>
          <p data-i="help6"></p>
        </div>
      </div>
    </div>

    <div class="modal" id="settings" hidden>
      <div class="in plate">
        <div class="mhead">
          <h2 data-i="setTitle"></h2>
          <button class="icon x" id="setClose" data-i-label="close">✕</button>
        </div>
        <h3 class="mh" data-i="langH"></h3>
        <select class="langSel" id="langSel" data-i-label="langH"></select>
        <h3 class="mh" data-i="screenH"></h3>
        <div class="langs"><button class="lcard" id="fsBtn"></button></div>
        <h3 class="mh" data-i="installH"></h3>
        <div class="langs"><button class="lcard" id="installBtn"></button></div>
        <p class="note" id="installNote" hidden></p>
        <h3 class="mh" data-i="soundH"></h3>
        <div class="sound">
          <button class="lcard" id="sndToggle"></button>
          <div class="vols">
            <label class="vol"
              ><span data-i="volume"></span><input type="range" id="sndVol" min="0" max="100" step="5" /></label
            ><label class="vol"
              ><span data-i="music"></span><input type="range" id="musVol" min="0" max="100" step="5"
            /></label>
          </div>
        </div>
        <h3 class="mh" data-i="campaignH"></h3>
        <p class="note" data-i="diffNote"></p>
        <div class="camp" id="campaign"></div>
        <div class="confirm" id="confirm" hidden>
          <p id="confirmTxt"></p>
          <div class="btnrow">
            <button class="go" id="confirmYes" data-i="startOver"></button
            ><button id="confirmNo" data-i="cancel"></button>
          </div>
        </div>
      </div>
    </div>


    <div class="modal fsask" id="fsAsk" hidden>
      <div class="in plate">
        <h2 data-i="fsAskT"></h2>
        <p class="note" data-i="fsAskTxt"></p>
        <div class="btnrow">
          <button class="big go" id="fsYes" data-i="fsOn"></button
          ><button class="big" id="fsNo" data-i="fsLater"></button>
        </div>
      </div>
    </div>

    <!-- offered once on a phone; a sheet from the bottom, the game stays visible behind it -->
    <div class="modal fsask sheet" id="installAsk" hidden role="dialog" aria-labelledby="installAskT">
      <div class="in plate">
        <h2 id="installAskT" data-i="installAskT"></h2>
        <p class="note" id="installAskTxt" data-i="installAskTxt"></p>
        <div class="btnrow">
          <button class="big go" id="installYes" data-i="installBtn"></button
          ><button class="big" id="installNo" data-i="installLater"></button>
        </div>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
