      height: 15
      routes:
        main:
          spawn: [[0, 1], [0, 2], [0, 3]]
          exit: [[23, 11], [23, 12], [23, 13]]
          dir: [1, 0]
      walls:
        - x: 0
          y: 4
          w: 20
          h: 1
        - x: 4
          y: 8
          w: 20
          h: 1
  fronts:
    finalWave: 150
    map:
      width: 23
      height: 15
      routes:
        east:
          spawn: [[0, 3], [0, 4], [0, 5]]
          exit: [[22, 3], [22, 4], [22, 5]]
          dir: [1, 0]
        west:
          spawn: [[22, 9], [22, 10], [22, 11]]
          exit: [[0, 9], [0, 10], [0, 11]]
          dir: [-1, 0]
        south:
          spawn: [[10, 0], [11, 0], [12, 0]]
          exit: [[10, 14], [11, 14], [12, 14]]
          dir: [0, 1]
  corner:
    finalWave: 80
    map:
      width: 20
      height: 14
      routes:
        main:
          spawn: [[0, 3], [0, 4], [0, 5]]
          exit: [[15, 13], [16, 13], [17, 13]]
          dir: [1, 0]
          exitDir: [0, 1]
      walls:
        - x: 6
          y: 1
          w: 3
          h: 3
        - x: 11
          y: 6
          w: 3
          h: 4
        - x: 3
          y: 9
          w: 3
          h: 3
# Money. The player earns from kills (enemies.*.rw, grown by scaling.rewardGrowth), from clearing a wave
# (waveClearBonus) and from calling a wave early (earlyBonusPerSecond per second left on the timer).
economy:
  sellRefund: 0.7
  ultimateCostMultiplier: 3
  overclock:
    damageGrowth: 1.25
    costBase: 1.5
    costGrowth: 1.45
  waveClearBonus:
    base: 4
    perWave: 1
  earlyBonusPerSecond: 1
  score:
    perReward: 10
    perWave: 1
  cheats:
    hesoyam:
      minLives: 100
      credits: 250000
# Enemy HP by wave n: unitHp * (1 + linear*(n-1) + quadratic*(n-1)^2), times lateGrowth^(n-lateFromWave) after
# lateFromWave. The difficulty HP bonus (difficulty.*.hp) fades in over [rampFromWave, rampFromWave+rampLength].
scaling:
  unitHp: 32
  linear: 0.24
  quadratic: 0.02
  lateFromWave: 100
  lateGrowth: 1.013
  rampFromWave: 8
  rampLength: 52
  flyerHpExponent: 0.9
  rewardGrowth: 0.04
