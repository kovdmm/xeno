# All numbers of the game. Nothing here is text for the player (that lives in src/i18n); the file is validated by
# src/game/balance.ts, so a typo fails at startup and in the tests.
# Time is in seconds, distances in cells, HP/damage in "points"; arrays of 4 are the tower levels 1..4.

board:
  enemyBlockRadius: 0.75
levels:
  crossroads:
    finalWave: 200
    map:
      width: 22
      height: 15
      routes:
        h:
          spawn: [[0, 6], [0, 7], [0, 8]]
          exit: [[21, 6], [21, 7], [21, 8]]
          dir: [1, 0]
        v:
          spawn: [[10, 0], [11, 0], [12, 0]]
          exit: [[10, 14], [11, 14], [12, 14]]
          dir: [0, 1]
  switchback:
